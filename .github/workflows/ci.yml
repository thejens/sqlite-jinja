name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Format
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --check

      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --no-default-features --features static --all-targets -- -D warnings

      - name: Rust tests (statically linked SQLite)
        run: cargo test --no-default-features --features static

      - name: Build loadable extension
        run: cargo build --release

      - name: End-to-end tests (loadable extension in Python's SQLite)
        run: python -m unittest discover -s tests/python -v
